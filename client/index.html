<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Velocity — a fast, private notes app with Markdown, tiling and whiteboards." />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <title>Velocity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter is the cross-platform stand-in for SF Pro; Apple devices use the system font. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <script>
      // Resolve theme family + appearance before first paint to avoid a flash.
      // Mirrors resolveAppearance() in src/lib/themes.ts; this map is kept in sync
      // with THEME_FAMILIES by a unit test (themes.test.ts).
      try {
        var THEMES = {"apple":["light","dark"],"catppuccin":["light","dark"],"catppuccin-macchiato":["light","dark"],"gruvbox":["light","dark"],"everforest":["light","dark"],"nord":["light","dark"],"solarized":["light","dark"]}
        var d = document.documentElement
        var p = JSON.parse(localStorage.getItem('velocity.prefs.v1') || '{}')
        var f = typeof p.themeFamily === 'string' && THEMES.hasOwnProperty(p.themeFamily) ? p.themeFamily : 'apple'
        var t = p.theme === 'light' || p.theme === 'dark' ? p.theme
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        if (THEMES[f].indexOf(t) < 0) t = THEMES[f][0]
        d.dataset.themeFamily = f
        d.dataset.theme = t
        d.dataset.accent = p.accent || 'theme'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
