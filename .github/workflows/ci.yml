name: CI

# Full suites live here, not in local agent sessions: agents run only the tests
# their change touches, and Playwright E2E runs only in this workflow.
on:
  pull_request:
  push:
    branches: [main, 'deploy/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit + API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --cwd client
      - run: bun install --frozen-lockfile --cwd server
      - run: bun run --cwd client lint
      - run: bun run --cwd client typecheck
      - run: bun run --cwd client test
      - run: bun run --cwd server test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --cwd client
      - run: bun install --frozen-lockfile --cwd server
      # The Playwright test runner itself still runs on the runner's Node.js (it does
      # not support Bun); the API and Vite dev server it starts run on Bun.
      - run: bunx playwright install --with-deps chromium
        working-directory: client
      - run: bun run test:e2e
        working-directory: client
        env:
          E2E_SHOTS_DIR: ci
      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            docs/screenshots/ci/
            client/test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e-browser-only:
    name: E2E (Playwright, browser-only build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npx playwright test -c playwright.local.config.ts
        working-directory: client
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-browser-only-results
          path: client/test-results/
          if-no-files-found: ignore
          retention-days: 14
