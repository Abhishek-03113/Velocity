services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file: .env
    environment:
      PORT: 3000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:37801}
    volumes:
      - velocity_data:/app/data
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:37800}
    ports:
      - "37801:80"
    depends_on:
      - server
    restart: unless-stopped

  server-proxy:
    image: nginx:alpine
    ports:
      - "37800:80"
    volumes:
      - ./nginx-api-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    restart: unless-stopped

volumes:
  velocity_data:
