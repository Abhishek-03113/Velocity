services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        # LaTeX plugin: LATEX=on installs a TeX engine for PDF compiles.
        LATEX: ${LATEX:-off}
    image: velocity-server
    # Bun runs as PID 1; tini forwards SIGTERM so `docker compose down` stops it cleanly.
    init: true
    env_file: .env
    environment:
      PORT: 3000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:37801}
    volumes:
      - velocity_data:/app/data
      - ${HOME}/velocity_docs:/root/velocity_docs
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:37800}
    image: velocity-client
    ports:
      - "37801:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server-proxy:
    image: nginx:alpine
    ports:
      - "37800:80"
    volumes:
      - ./nginx-api-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  velocity_data:
